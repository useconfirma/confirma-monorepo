server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Não expõe a versão do Nginx.
    server_tokens off;

    # Compressão gzip para texto (HTML, CSS, JS, XML, SVG e manifest).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml
        application/manifest+json image/svg+xml text/plain;

    # Cabeçalhos básicos de segurança. O cache usa `expires` nos blocos abaixo
    # para não anular estes cabeçalhos (um `add_header` no location anularia).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Arquivos com hash no nome (gerados pelo Astro): cache de um ano.
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    # Fontes e imagens de public/: cache de uma semana.
    location ~* \.(woff2?|png|ico|svg|webp|jpg)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Páginas estáticas: sempre revalidadas.
    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }
}

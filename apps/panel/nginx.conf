server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Não expõe a versão do Nginx.
    server_tokens off;

    # Compressão gzip para texto (HTML, CSS, JS, JSON e SVG).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cabeçalhos básicos de segurança. O cache usa `expires` nos blocos abaixo
    # para não anular estes cabeçalhos (um `add_header` no location anularia).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Arquivos com hash no nome (gerados pelo Vite): cache de um ano.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: qualquer rota volta para o index.html, sempre revalidado.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: confirma
            POSTGRES_USER: confirma
            POSTGRES_PASSWORD: confirma
        ports:
            - '5434:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data

    postgres-test:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: confirma_test
            POSTGRES_USER: confirma
            POSTGRES_PASSWORD: confirma
        ports:
            - '5433:5432'

volumes:
    postgres-data:
